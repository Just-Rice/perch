# Checks every push and pull request: the host's tests, the website's tests and the app's build and self-test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install the host's packages
        working-directory: host/node
        run: npm ci

      - name: Host tests
        working-directory: host/node
        run: node --test --test-concurrency=1 --test-timeout=180000 $(ls test/*.test.mjs | grep -v -e browser -e chrome-smoke)

      - name: Website tests
        run: node --test --test-concurrency=1 --test-timeout=180000 $(ls tests/site/*.test.mjs | grep -v browser)

      # Headless Chrome on a shared 3-core runner now and then misses a timing; these get one retry.
      - name: Browser tests (Setup page, Chrome video, website screens)
        run: |
          run() { node --test --test-concurrency=1 --test-timeout=180000 host/node/test/setup-browser.test.mjs \
            host/node/test/chrome-smoke.test.mjs tests/site/*.browser.test.mjs; }
          run || { echo "::warning::browser tests failed once; retrying"; run; }

      - name: Build the app and run its self-test
        run: |
          swift build -c release --package-path host/app
          host/app/.build/release/Perch --selftest

      - name: Website and host end to end
        run: |
          run() { node --test --test-concurrency=1 --test-timeout=180000 tests/e2e/full.test.mjs; }
          run || { echo "::warning::end-to-end tests failed once; retrying"; run; }

      - name: Website, host and the real app end to end
        run: |
          run() { node --test --test-concurrency=1 --test-timeout=180000 tests/e2e/app.test.mjs; }
          run || { echo "::warning::app end-to-end test failed once; retrying"; run; }
