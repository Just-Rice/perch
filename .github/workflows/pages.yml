# Publishes the website (site/ on main) to https://faarisaahmed.github.io/roost/ whenever it changes: copies it to
# the gh-pages branch, which GitHub Pages serves. (Pages' Actions deployment kept failing on GitHub's side for this
# repo; the branch works.)
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copy site/ to the gh-pages branch
        run: |
          out="$(mktemp -d)"
          cp -R site/. "$out/"
          touch "$out/.nojekyll"   # serve files as they are, no Jekyll
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
