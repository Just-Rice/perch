# Publishes the website to https://just-rice.github.io/perch/ whenever it changes on main: Perch's (mac/site/) at
# /perch/ and Roost's, for Windows (windows/site/), at /perch/windows/.
name: Pages

on:
  push:
    branches: [main]
    paths: ['mac/site/**', 'windows/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Put the two websites together
        run: |
          mkdir -p _site/windows
          cp -R mac/site/. _site/
          cp -R windows/site/. _site/windows/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
