# Roost, the Windows version: builds and publishes a release when a windows- version tag is pushed
# (git tag windows-v0.2.0 && git push origin windows-v0.2.0): Roost-<version>-win-x64.zip and -win-arm64.zip with
# their checksums, which install.ps1 and the update check use. Tags with a suffix (windows-v0.2.0-alpha.1) become
# pre-releases, installed only by name. A Roost release is never marked "latest": that stays Perch's (the Mac's
# updater and install.sh use it), and Roost finds its own releases by their windows- tag.
name: Windows release

on:
  push:
    tags: ['windows-v*']

defaults:
  run:
    working-directory: windows

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: The tag matches the version in the code
        shell: pwsh
        run: |
          $v = (Get-Content host/package.json -Raw | ConvertFrom-Json).version
          if ("windows-v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but host/package.json says $v (run scripts/set-version.mjs)" }
      - run: npm ci
        working-directory: windows/host
      - name: Build roost.exe
        working-directory: windows/app
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Arch ${{ matrix.arch }} -Exe app/target/${{ matrix.target }}/release/roost.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: windows/dist/Roost-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          v="${tag#windows-v}"
          pre=""
          case "$v" in *-*) pre="--prerelease";; esac
          gh release create "$tag" dist/Roost-* --repo "${{ github.repository }}" --title "Roost $v (Windows)" --latest=false $pre \
            --notes "Install or update, in PowerShell: \`irm https://just-rice.github.io/perch/windows/install.ps1 | iex\`"
