# The Worker relay, for Perch and Roost alike: deploy it to your own Cloudflare account (free plan), then paste its
# address into Perch's Setup or Roost's Control Center. See core/relay/README.md.
name = "perch-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "CONFIG"
class_name = "Config"

# SQLite-backed Durable Objects: available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Config"]

[[durable_objects.bindings]]
name = "BROKER"
class_name = "Broker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Broker"]

# The website (Perch's at /, Roost's at /windows/), served from this relay's own address too: where only
# *.workers.dev gets through, the website does as well, and it finds the computer through this relay's broker
# (site/js/ui/app.js, ownRelayBroker). build-site.mjs puts the two together in .site/ first.
[build]
command = "node build-site.mjs"

[assets]
directory = ".site"
binding = "ASSETS"
