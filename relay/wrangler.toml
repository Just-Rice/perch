# Perch's Worker relay: deploy it to your own Cloudflare account (free plan), then paste its address into Setup.
# See relay/README.md.
name = "perch-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "CONFIG"
class_name = "Config"

# SQLite-backed Durable Objects: available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Config"]
